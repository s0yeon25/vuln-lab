[global]
   workgroup = WORKGROUP
   server string = Samba Server %v
   security = user
   map to guest = bad user
   log file = /var/log/samba/log.%m
   max log size = 50
   dns proxy = no

   # SMB를 특정 인터페이스에만 바인딩 (8081 포트 충돌 방지)
   interfaces = eth0 lo
   bind interfaces only = yes

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[share]
   path = /share
   writable = yes
   guest ok = yes
   guest only = yes
   create mask = 0777
   directory mask = 0777
   nt acl support = no
