[global]
   workgroup = WORKGROUP
   server string = Samba Server %v
   security = user
   map to guest = bad user
   log file = /var/log/samba/log.%m
   max log size = 50
   dns proxy = no

   # SambaCry CVE-2017-7494 취약 설정
   # pipe support 활성화 (취약점 트리거에 필요)
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[share]
   path = /share
   writable = yes
   guest ok = yes
   guest only = yes
   create mask = 0777
   directory mask = 0777
   # pipe support (CVE-2017-7494 필요 조건)
   nt acl support = no
