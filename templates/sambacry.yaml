id: CVE-2017-7494

info:
  name: SambaCry Detection
  author: test
  severity: critical
  tags: cve,samba

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "Samba"
          - "SMB"
        condition: or