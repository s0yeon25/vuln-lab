id: CVE-2018-15473

info:
  name: SSH User Enumeration
  author: test
  severity: medium
  tags: cve,ssh

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "OpenSSH"
          - "SSH"
        condition: or